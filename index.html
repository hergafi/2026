<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ASCII Motion Studio | FX Production 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg:#ffffff; --surface:#f5f5f7; --border:#d2d2d7;
    --text:#1d1d1f; --text-muted:#86868b; --accent:#0071e3; --accent-hover:#0077ed;
  }
  [data-theme="dark"] {
    --bg:#000000; --surface:#161617; --border:#38383a;
    --text:#f5f5f7; --text-muted:#86868b; --accent:#0a84ff; --accent-hover:#409cff;
  }
  *{box-sizing:border-box;margin:0;padding:0;outline:none;transition:background-color .25s ease,color .25s ease,border-color .25s ease}
  body{background-color:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

  .workspace{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;position:relative;overflow:auto}
  .placeholder{position:absolute;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--text-muted);font-size:14px;font-weight:500;pointer-events:none}
  .placeholder svg{width:48px;height:48px;stroke:var(--text-muted);stroke-width:1.5;fill:none}

  #output{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:pre;line-height:1;font-size:10px;display:none;direction:ltr;text-align:left;user-select:all}

  #live-badge{position:absolute;top:20px;inset-inline-start:24px;display:none;align-items:center;gap:6px;color:#ff3b30;font-size:11px;font-weight:700;letter-spacing:2px;z-index:15}
  #live-badge .dot{width:8px;height:8px;border-radius:0;background:#ff3b30;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

  .toolbar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:8px;border-radius:0;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:10;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}

  .tool-item{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);padding:6px 10px;border-radius:0;flex-shrink:0}
  .tool-item svg{width:16px;height:16px;stroke:var(--text-muted);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  button,label.icon-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  button svg,label.icon-btn svg{width:18px;height:18px;stroke:var(--text);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  button:hover,label.icon-btn:hover{background:var(--border)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary svg{stroke:#fff}
  button.primary:hover{background:var(--accent-hover)}

  button.live-active{background:#ff3b30;border-color:#ff3b30;color:#fff;animation:pulse 1.6s infinite}
  button.live-active svg{stroke:#fff}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.5)}70%{box-shadow:0 0 0 10px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}

  input[type="file"]{display:none}
  input[type="color"]{border:none;width:22px;height:22px;border-radius:0;cursor:pointer;background:transparent}
  input[type="range"]{accent-color:var(--accent);width:60px;height:4px}
  select{background:transparent;color:var(--text);border:none;outline:none;font-size:13px;font-weight:500;cursor:pointer}
  select option{background:var(--surface);color:var(--text)}

  #progress-container{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);width:220px;height:4px;background:var(--border);border-radius:0;display:none;overflow:hidden;z-index:20}
  #progress-bar{height:100%;width:0%;background:var(--accent);transition:width .15s}

  /* Toggle Switch Style - Square */
  .toggle-switch{position:relative;width:44px;height:24px;background:var(--border);border-radius:0;cursor:pointer;transition:background .25s}
  .toggle-switch.active{background:var(--accent)}
  .toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:0;transition:transform .25s}
  .toggle-switch.active::after{transform:translateX(20px)}
  
  .tool-label{font-size:11px;color:var(--text-muted);font-weight:500;white-space:nowrap}
  
  #video-preview{position:absolute;top:20px;right:20px;width:240px;border-radius:0;border:1px solid var(--border);display:none!important;visibility:hidden;opacity:0;z-index:5}
  
  .mode-indicator{position:absolute;top:20px;inset-inline-end:24px;display:none;align-items:center;gap:6px;color:var(--accent);font-size:11px;font-weight:700;z-index:15}
  .mode-indicator svg{width:14px;height:14px;stroke:var(--accent);stroke-width:2;fill:none}
  
  /* Fullscreen Button */
  #btn-fullscreen{position:absolute;top:20px;left:20px;z-index:15}
  
  /* Exit Fullscreen Floating Button */
  #btn-exit-fullscreen{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);color:var(--text);width:48px;height:48px;border-radius:0;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  #btn-exit-fullscreen svg{width:20px;height:20px;stroke:var(--text);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  #btn-exit-fullscreen:hover{background:var(--border)}
  
  /* Fullscreen Mode Styles */
  body.fullscreen-mode .toolbar,
  body.fullscreen-mode #live-badge,
  body.fullscreen-mode #mode-indicator,
  body.fullscreen-mode #btn-fullscreen,
  body.fullscreen-mode #progress-container{display:none!important}
  body.fullscreen-mode #btn-exit-fullscreen{display:flex!important}
  body.fullscreen-mode .workspace{padding:0}
  body.fullscreen-mode #output{font-size:12px}
</style>
</head>

    </button>

    <div class="tool-item" title="الدقة (Scale)">

    </button>

    <div class="tool-item" title="نمط الرموز">

      <input type="range" id="volume" min="0" max="100" step="1" value="100">

      <select id="export-format">
        <option value="video">VIDEO 24fps ⚡</option>

    </button>

<script>
/* ============================================================
   ASCII Motion Studio — FX Production 2026
   Enhanced with: Full Color Mode, Video Import, Edge Detection,
   Brightness & Gamma Controls
   ============================================================ */
const CHAR_SETS = {
  detailed: " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
  classic:  " .:-=+*#%@$",
  minimal:  " .:-=#@",
  blocks:   " ░▒▓█",
  math:     " ·÷+-×±=≠≈∞∑∏√∫§"
};

const FPS = 24;
const ANIM_COLUMNS = 100;
const FRAMES = 48;
const TARGET_WIDTH = 3840;
const MONO_FONT = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

let currentImg = null;
let currentVideo = null;
let isLive = false, liveStream = null, liveVideo = null, liveRAF = null, lastLive = 0;
let videoPlaybackInterval = null;
let isFullColorActive = false; // Default: Monochrome mode
let useEdgeDetection = false;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Advanced Grid Sampling with RGB, Edge Detection, Brightness, Gamma ---------- */
function sampleGridAdvanced(src, w, contrastVal, brightnessVal, gammaVal, edgeMode, mirror = false) {
  const sw = src.videoWidth || src.naturalWidth || src.width;
  const sh = src.videoHeight || src.naturalHeight || src.height;
  if (!sw || !sh) return null;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const h = Math.floor(w * (sh / sw) * 0.5);
  c.width = w; c.height = h;
  
  // Apply filters
  let filterStr = `contrast(${contrastVal}) brightness(${1 + brightnessVal/100})`;
  ctx.filter = filterStr;
  
  if (mirror) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(src, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  
  const grid = new Float32Array(w * h);
  const rgbGrid = new Uint32Array(w * h);
  
  for (let i = 0; i < w * h; i++) {
    const p = i * 4;
    let r = d[p], g = d[p+1], b = d[p+2];
    
    // Apply gamma correction
    r = Math.min(255, Math.pow(r / 255, 1/gammaVal) * 255);
    g = Math.min(255, Math.pow(g / 255, 1/gammaVal) * 255);
    b = Math.min(255, Math.pow(b / 255, 1/gammaVal) * 255);
    
    rgbGrid[i] = (Math.floor(r) << 16) | (Math.floor(g) << 8) | Math.floor(b);
    
    if (edgeMode) {
      // Sobel edge detection approximation using neighboring pixels
      const x = i % w, y = Math.floor(i / w);
      let gx = 0, gy = 0;
      if (x > 0 && x < w-1 && y > 0 && y < h-1) {
        const getLum = (xx, yy) => {
          const idx = (yy * w + xx) * 4;
          return d[idx]*0.299 + d[idx+1]*0.587 + d[idx+2]*0.114;
        };
        gx = -getLum(x-1,y-1) - 2*getLum(x-1,y) - getLum(x-1,y+1) 
             + getLum(x+1,y-1) + 2*getLum(x+1,y) + getLum(x+1,y+1);
        gy = -getLum(x-1,y-1) - 2*getLum(x,y-1) - getLum(x+1,y-1)
             + getLum(x-1,y+1) + 2*getLum(x,y+1) + getLum(x+1,y+1);
      }
      const magnitude = Math.sqrt(gx*gx + gy*gy);
      grid[i] = Math.min(255, magnitude) / 255;
    } else {
      grid[i] = (r*0.299 + g*0.587 + b*0.114) / 255;
    }
  }
  return { grid, rgbGrid, w, h };
}

/* ---------- ASCII from Grid (Monochrome or Color-aware) ---------- */
function asciiFromGrid(g, density, setKey) {
  const ch = CHAR_SETS[setKey] || CHAR_SETS.detailed;
  const len = ch.length;
  const rows = new Array(g.h);
  for (let y = 0; y < g.h; y++) {
    let row = '';
    const off = y * g.w;
    for (let x = 0; x < g.w; x++) {
      let v = g.grid[off + x];
      if (density !== null) v = Math.pow(v, density);
      row += ch[Math.max(0, Math.min(len - 1, Math.floor(v * (len - 1))))];
    }
    rows[y] = row;
  }
  return rows.join('\n');
}

/* ---------- Paint ASCII on Canvas (with optional full color) ---------- */
function paintAscii(ctx, W, H, text, textColor, bgColor, fontSize, pad, copyright, g = null, colorMode = false) {
  const lines = text.split('\n');
  ctx.fillStyle = bgColor; ctx.fillRect(0, 0, W, H);
  ctx.font = `${fontSize}px ${MONO_FONT}`;
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  
  if (colorMode && g && g.rgbGrid) {
    // Full color mode: draw each character with its RGB color
    for (let y = 0; y < g.h; y++) {
      for (let x = 0; x < g.w; x++) {
        const rgb = g.rgbGrid[y * g.w + x];
        const r = (rgb >> 16) & 0xFF;
        const gVal = (rgb >> 8) & 0xFF;
        const b = rgb & 0xFF;
        ctx.fillStyle = `rgb(${r},${gVal},${b})`;
        const ch = lines[y][x] || ' ';
        ctx.fillText(ch, pad + x * fontSize * 0.6, pad + y * fontSize);
      }
    }
  } else {
    // Monochrome mode
    ctx.fillStyle = textColor;
    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], pad, pad + i * fontSize);
    }
  }
  
  if (copyright) {
    // Add copyright watermark: © FX Production 2026 (Bottom-Right)
    ctx.globalAlpha = 0.7;
    const cFont = Math.max(14, Math.min(24, fontSize * 0.5));
    ctx.font = `${cFont}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = textColor;
    ctx.fillText('© FX Production 2026', W - pad + 20, H - pad / 2);
    ctx.globalAlpha = 1;
  }
}

/* ---------- Preview Rendering ---------- */
const processSource = () => {
  const src = isLive ? liveVideo : (currentVideo || currentImg);
  if (!src || isLive && liveVideo.readyState < 2) return;
  
  const g = sampleGridAdvanced(src, parseInt($('resolution').value), 
    parseFloat($('contrast').value), parseInt($('brightness').value), 
    parseFloat($('gamma').value), useEdgeDetection);
  
  const out = $('output');
  out.textContent = asciiFromGrid(g, null, $('char-set').value);
  // In Full Color mode, each character has its own RGB color applied in paintAscii
  // For preview, we just show the text without individual colors
  out.style.display = 'block';
  $('placeholder-text').style.display = 'none';
  
  // Update mode indicator
  $('mode-indicator').style.display = isFullColorActive ? 'flex' : 'none';
};

let rafId = null;
const schedule = () => { if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(processSource); };

$('resolution').addEventListener('input', schedule);
$('contrast').addEventListener('input', schedule);
$('brightness').addEventListener('input', schedule);
$('gamma').addEventListener('input', schedule);
$('char-set').addEventListener('change', processSource);

// Full Color Mode Toggle - True Per-Pixel Color Mode
$('btn-fullcolor').addEventListener('click', function() {
  isFullColorActive = !isFullColorActive;
  this.classList.toggle('active', isFullColorActive);
  this.title = isFullColorActive ? 'تعطيل التلوين — Disable Color' : 'تلوين كامل — Full Color Mode';
  // Force immediate redraw to reflect color change
  schedule();
});

// Edge detection toggle
$('edge-toggle').addEventListener('click', function() {
  this.classList.toggle('active');
  useEdgeDetection = this.classList.contains('active');
  schedule();
});

/* ---------- LIVE MOTION ---------- */
$('btn-live').addEventListener('click', async () => {
  if (isLive) { stopLive(); return; }
  stopVideoPlayback();
  try {
    liveVideo = document.createElement('video');
    // Note: Camera audio requires user permission and is typically muted for privacy
    // Volume slider controls virtual gain if needed in future implementation
    liveVideo.muted = true; liveVideo.playsInline = true; liveVideo.autoplay = true;
    liveStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 } }, audio: false
    });
    liveVideo.srcObject = liveStream;
    await liveVideo.play();
    isLive = true;
    $('btn-live').classList.add('live-active');
    $('live-badge').style.display = 'flex';
    $('placeholder-text').style.display = 'none';
    lastLive = 0;
    liveRAF = requestAnimationFrame(liveLoop);
  } catch (err) {
    console.error(err);
    alert('تعذر الوصول إلى الكاميرا — تحقق من الأذونات');
  }
});

function stopLive() {
  isLive = false;
  if (liveRAF) cancelAnimationFrame(liveRAF);
  if (liveStream) liveStream.getTracks().forEach(t => t.stop());
  $('btn-live').classList.remove('live-active');
  $('live-badge').style.display = 'none';
  if (currentImg || currentVideo) processSource();
  else {
    $('output').style.display = 'none';
    $('placeholder-text').style.display = 'flex';
  }
}

function liveLoop(ts) {
  if (!isLive) return;
  liveRAF = requestAnimationFrame(liveLoop);
  if (ts - lastLive < 33) return;
  lastLive = ts;
  if (liveVideo.readyState >= 2) {
    const g = sampleGridAdvanced(liveVideo, Math.min(160, parseInt($('resolution').value)), 
      parseFloat($('contrast').value), parseInt($('brightness').value), 
      parseFloat($('gamma').value), useEdgeDetection, true);
    if (!g) return;
    const out = $('output');
    out.textContent = asciiFromGrid(g, null, $('char-set').value);
    out.style.color = $('text-color').value;
    out.style.display = 'block';
  }
}

/* ---------- Theme Toggle ---------- */
$('btn-theme').addEventListener('click', () => {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  if (isDark) { $('bg-color').value = '#ffffff'; $('text-color').value = '#1d1d1f'; }
  else        { $('bg-color').value = '#000000'; $('text-color').value = '#f5f5f7'; }
  if (!isFullColorActive) {
    if (isLive) $('output').style.color = $('text-color').value; else processSource();
  }
});

/* ---------- Image Upload ---------- */
const loadFile = f => {
  if (!f || !f.type.startsWith('image/')) return;
  stopLive();
  stopVideoPlayback();
  const r = new FileReader();
  r.onload = e => { const i = new Image(); i.onload = () => { currentImg = i; currentVideo = null; processSource(); }; i.src = e.target.result; };
  r.readAsDataURL(f);
};
$('file-input').addEventListener('change', e => loadFile(e.target.files[0]));

/* ---------- Video Upload ---------- */
const loadVideo = f => {
  if (!f || !f.type.startsWith('video/')) return;
  stopLive();
  stopVideoPlayback();
  const video = $('video-preview');
  video.src = URL.createObjectURL(f);
  video.muted = false; // Enable audio for original video playback
  video.style.display = 'none'; // Keep hidden - only show ASCII art
  video.onloadeddata = () => {
    currentVideo = video;
    currentImg = null;
    video.play();
    // Set initial volume
    video.volume = parseInt($('volume').value) / 100;
    startVideoPlayback();
    $('placeholder-text').style.display = 'none';
  };
};
$('video-input').addEventListener('change', e => loadVideo(e.target.files[0]));

// Volume control for video
$('volume').addEventListener('input', function() {
  const vol = parseInt(this.value) / 100;
  if (currentVideo) {
    currentVideo.volume = vol;
  }
  if (liveVideo) {
    liveVideo.volume = vol;
  }
});

function startVideoPlayback() {
  if (videoPlaybackInterval) clearInterval(videoPlaybackInterval);
  videoPlaybackInterval = setInterval(() => {
    if (currentVideo && !currentVideo.paused && currentVideo.readyState >= 2) {
      processSource();
    }
  }, 1000 / FPS);
}

function stopVideoPlayback() {
  if (videoPlaybackInterval) clearInterval(videoPlaybackInterval);
  videoPlaybackInterval = null;
  const video = $('video-preview');
  if (video) {
    video.pause();
    video.style.display = 'none';
    video.src = '';
  }
  currentVideo = null;
}

/* ---------- Drag & Drop ---------- */
const dz = $('drop-zone');
['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.style.opacity = '.8'; }));
['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.style.opacity = '1'; }));
dz.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadFile(f);
  else if (f && f.type.startsWith('video/')) loadVideo(f);
});

/* ---------- Progress Bar ---------- */
const showProgress = v => { $('progress-container').style.display = 'block'; $('progress-bar').style.width = v + '%'; };
const hideProgress = () => { $('progress-bar').style.width = '0%'; $('progress-container').style.display = 'none'; };

/* ---------- Recorder Helper ---------- */
function makeRecorder(canvas, onDone) {
  let mime = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp8';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4';
  const ext = mime.includes('mp4') ? 'mp4' : 'webm';
  const rec = new MediaRecorder(canvas.captureStream(FPS), { mimeType: mime, videoBitsPerSecond: 10_000_000 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => onDone(new Blob(chunks, { type: mime }), ext);
  return rec;
}

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- VIDEO Export: Density Sweep (Still Image) ---------- */
async function exportSweepVideo() {
  try {
    const src = currentImg;
    if (!src) throw new Error('No source image available');
    const g = sampleGridAdvanced(src, ANIM_COLUMNS, parseFloat($('contrast').value), 
      parseInt($('brightness').value), parseFloat($('gamma').value), useEdgeDetection);
    if (!g) throw new Error('Failed to sample grid');
    const tc = $('text-color').value, bg = $('bg-color').value;
    const fontSize = 14, pad = 60;
    const W = Math.ceil(g.w * fontSize * 0.6) + pad * 2;
    const H = g.h * fontSize + pad * 2 + 40;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');

    const rec = makeRecorder(c, (blob, ext) => saveBlob(blob, `FX-PRODUCTION-MOTION.${ext}`));
    paintAscii(ctx, W, H, asciiFromGrid(g, 1, $('char-set').value), tc, bg, fontSize, pad, true, null, false);
    rec.start();

    for (let i = 0; i < FRAMES; i++) {
      const t = i / (FRAMES - 1);
      const pp = t < .5 ? t * 2 : 2 - t * 2;
      paintAscii(ctx, W, H, asciiFromGrid(g, 0.5 + pp * 2.5, $('char-set').value), tc, bg, fontSize, pad, true, null, false);
      showProgress(Math.round(((i + 1) / FRAMES) * 100));
      await sleep(1000 / FPS);
    }
    rec.stop();
    await new Promise(r => setTimeout(r, 300));
  } catch (err) {
    console.error('Export error:', err);
    alert(`خطأ في التصدير: ${err.message || err}`);
  }
}

/* ---------- VIDEO Export: Live Camera (3s) ---------- */
async function exportLiveVideo() {
  try {
    const tc = $('text-color').value, bg = $('bg-color').value;
    const con = parseFloat($('contrast').value), br = parseInt($('brightness').value), gm = parseFloat($('gamma').value);
    const set = $('char-set').value;
    const cols = ANIM_COLUMNS;
    const sw = liveVideo.videoWidth, sh = liveVideo.videoHeight;
    const rows = Math.floor(cols * (sh / sw) * 0.5);
    const fontSize = 14, pad = 60;
    const W = Math.ceil(cols * fontSize * 0.6) + pad * 2;
    const H = rows * fontSize + pad * 2 + 40;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');

    const total = FPS * 3;
    const rec = makeRecorder(c, (blob, ext) => saveBlob(blob, `FX-PRODUCTION-LIVE.${ext}`));
    rec.start();

    for (let i = 0; i < total; i++) {
      const g = sampleGridAdvanced(liveVideo, cols, con, br, gm, useEdgeDetection, true);
      if (g) paintAscii(ctx, W, H, asciiFromGrid(g, null, set), tc, bg, fontSize, pad, true, null, false);
      showProgress(Math.round(((i + 1) / total) * 100));
      await sleep(1000 / FPS);
    }
    rec.stop();
    await new Promise(r => setTimeout(r, 300));
  } catch (err) {
    console.error('Export error:', err);
    alert(`خطأ في التصدير: ${err.message || err}`);
  }
}

/* ---------- VIDEO Export: Uploaded Video Frames ---------- */
async function exportVideoFile() {
  try {
    if (!currentVideo) throw new Error('No video loaded');
    const tc = $('text-color').value, bg = $('bg-color').value;
    const con = parseFloat($('contrast').value), br = parseInt($('brightness').value), gm = parseFloat($('gamma').value);
    const set = $('char-set').value;
    const cols = ANIM_COLUMNS;
    const video = currentVideo;
    
    // Get video dimensions
    const sw = video.videoWidth, sh = video.videoHeight;
    const rows = Math.floor(cols * (sh / sw) * 0.5);
    const fontSize = 14, pad = 60;
    const W = Math.ceil(cols * fontSize * 0.6) + pad * 2;
    const H = rows * fontSize + pad * 2 + 40;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');

    const duration = video.duration * 1000;
    const totalFrames = Math.min(Math.floor(duration / (1000 / FPS)), 300); // Cap at 300 frames or video length
    const frameInterval = duration / totalFrames;
    
    const rec = makeRecorder(c, (blob, ext) => saveBlob(blob, `FX-PRODUCTION-VIDEO.${ext}`));
    rec.start();
    
    video.currentTime = 0;
    video.pause();
    
    for (let i = 0; i < totalFrames; i++) {
      video.currentTime = (i * frameInterval) / 1000;
      await new Promise(resolve => {
        const onSeeked = () => {
          video.removeEventListener('seeked', onSeeked);
          resolve();
        };
        video.addEventListener('seeked', onSeeked);
      });
      
      const g = sampleGridAdvanced(video, cols, con, br, gm, useEdgeDetection);
      if (g) paintAscii(ctx, W, H, asciiFromGrid(g, null, set), tc, bg, fontSize, pad, true, null, false);
      showProgress(Math.round(((i + 1) / totalFrames) * 100));
      await sleep(1000 / FPS);
    }
    
    rec.stop();
    await new Promise(r => setTimeout(r, 300));
  } catch (err) {
    console.error('Export error:', err);
    alert(`خطأ في التصدير: ${err.message || err}`);
  }
}

/* ============================================================
   STATIC EXPORT (PNG/JPG/PDF) - 4K Real with Full Color Support
   ============================================================ */
function exportStatic(format) {
  try {
    const src = isLive ? liveVideo : (currentVideo || currentImg);
    if (!src) throw new Error('No source available');
    const pad = 200;

    const cols = parseInt($('resolution').value);
    const g = sampleGridAdvanced(src, cols, parseFloat($('contrast').value), 
      parseInt($('brightness').value), parseFloat($('gamma').value), useEdgeDetection, isLive);
    if (!g) throw new Error('Failed to sample grid');
    const text = asciiFromGrid(g, null, $('char-set').value);
    const lines = text.split('\n');

    const meas = document.createElement('canvas').getContext('2d');
    const baseFont = 10;
    meas.font = `${baseFont}px ${MONO_FONT}`;
    const baseW = meas.measureText(lines[0]).width || 1;
    const fontSize = Math.max(8, Math.floor(baseFont * (TARGET_WIDTH - pad * 2) / baseW));

    meas.font = `${fontSize}px ${MONO_FONT}`;
    const W = Math.ceil(meas.measureText(lines[0]).width) + pad * 2;
    const H = Math.ceil(lines.length * fontSize) + pad * 2 + 80;

    const c = document.createElement('canvas');
    // Fallback to lower resolution if 4K fails
    try {
      c.width = W; c.height = H;
    } catch (e) {
      console.warn('Canvas too large, falling back to 2K', e);
      const scale = 0.5;
      c.width = Math.floor(W * scale); c.height = Math.floor(H * scale);
    }
    
    // Use full color mode if enabled and RGB data available
    paintAscii(c.getContext('2d'), c.width, c.height, text,
      $('text-color').value, $('bg-color').value, fontSize, pad, true, 
      isFullColorActive ? g : null, isFullColorActive);

    if (format === 'pdf') {
      if (typeof window.jspdf === 'undefined') {
        throw new Error('مكتبة PDF غير محملة. يرجى التحقق من الاتصال بالإنترنت.');
      }
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: c.width > c.height ? 'l' : 'p', unit: 'px', format: [c.width, c.height], compress: true });
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, c.width, c.height);
      pdf.save('FX-PRODUCTION-ASCII.pdf');
      return;
    }

    c.toBlob(blob => {
      if (!blob) throw new Error('فشل إنشاء الصورة');
      saveBlob(blob, `FX-PRODUCTION-4K.${format}`);
    }, format === 'jpg' ? 'image/jpeg' : 'image/png', 0.95);
  } catch (err) {
    console.error('Export error:', err);
    alert(`خطأ في التصدير: ${err.message || err}`);
  }
}

/* ---------- Main Download Handler ---------- */
$('btn-download').addEventListener('click', async () => {
  if ((!currentImg && !currentVideo && !isLive)) return alert('⚠️ حمّل صورة أو فيديو أو شغّل الكاميرا أولاً');
  const format = $('export-format')?.value || 'png';
  const btn = $('btn-download');
  btn.disabled = true;

  try {
    if (format === 'video') {
      if (typeof MediaRecorder === 'undefined' || !HTMLCanvasElement.prototype.captureStream) {
        throw new Error('المتصفح لا يدعم تسجيل الفيديو');
      } else if (isLive) {
        await exportLiveVideo();
      } else if (currentVideo) {
        await exportVideoFile();
      } else {
        await exportSweepVideo();
      }
    } else {
      exportStatic(format);
    }
  } catch (err) {
    console.error('Export error:', err);
    alert(`حدث خطأ أثناء التصدير: ${err.message || err}`);
  }

  btn.disabled = false;
  setTimeout(hideProgress, 800);
});

// Initialize - Full Color Mode is default

/* ---------- Fullscreen Toggle ---------- */
let isFullscreen = false;
$('btn-fullscreen').addEventListener('click', function() {
  isFullscreen = !isFullscreen;
  document.body.classList.toggle('fullscreen-mode', isFullscreen);
  this.innerHTML = isFullscreen 
    ? '<svg viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/><polyline points="9 9 3 3 9 3"/><polyline points="15 15 21 21 15 21"/><polyline points="15 9 21 3 15 3"/><polyline points="9 15 3 21 9 21"/></svg>';
  this.title = isFullscreen ? 'خروج من ملء الشاشة — Exit Fullscreen' : 'ملء الشاشة — Full Screen';
});

// Exit fullscreen button handler
$('btn-exit-fullscreen').addEventListener('click', function() {
  if (isFullscreen) {
    $('btn-fullscreen').click();
  }
});

// Keyboard support for Exit Fullscreen (Escape or F11)
document.addEventListener('keydown', function(e) {
  if (isFullscreen && (e.key === 'Escape' || e.key === 'F11')) {
    e.preventDefault();
    $('btn-exit-fullscreen').click();
  }
});

// Hide video preview completely - only show ASCII art
$('video-preview').style.display = 'none';
</script>
